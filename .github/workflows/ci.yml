# Pull-request / main CI: Magician load/save selftest (synthetic iNES, no ROM),
# then the production build (tsc + vite).
# `npm run check` also runs the inherited mapper 71 selftest and needs local dumps.
name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install, test, and build
        run: |
          npm ci
          npm run check:magician
          npm run build
