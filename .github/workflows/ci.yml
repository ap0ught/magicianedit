# Pull-request / main CI: Magician load/save selftest (synthetic iNES, no ROM),
# then the production build (tsc + vite).
# `npm run check` also runs the inherited mapper 71 selftest and needs local dumps.
# After that gate succeeds, publish Vercel Deployment Check statuses on the
# commit Vercel deploys: the pull request head, or the pushed commit on main.
name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  statuses: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install, test, and build
        run: |
          npm ci
          npm run check:magician
          npm run build

      # vercel/repository-dispatch status writes context.sha, which on
      # pull_request is the synthetic merge commit, not the head Vercel deploys.
      # Fork and Dependabot runs also get a read-only GITHUB_TOKEN, so skip
      # those rather than failing an otherwise green build.
      - name: notify vercel
        if: >-
          success() &&
          (
            github.event_name == 'push' ||
            (
              github.event_name == 'pull_request' &&
              github.event.pull_request.head.repo.full_name == github.repository &&
              github.event.pull_request.user.login != 'dependabot[bot]'
            )
          )
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const sha = context.eventName === 'pull_request'
              ? context.payload.pull_request.head.sha
              : context.sha;
            const targetUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const names = [
              'Vercel - magicianedit: lint',
              'Vercel - magicianedit: build',
            ];
            for (const name of names) {
              await github.rest.repos.createCommitStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha,
                state: 'success',
                context: name,
                target_url: targetUrl,
                description: 'CI build succeeded',
              });
            }
